version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    commit-message:
      prefix: chore
    labels:
      - dependencies
updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      # tsup's declaration bundler requires the TypeScript 6 compiler API.
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
