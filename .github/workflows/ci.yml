name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
    branches-ignore:
      - "**/graphite-base/**"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  optimize_ci:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check_skip.outputs.skip }}
    steps:
      - name: Optimize CI
        id: check_skip
        uses: withgraphite/graphite-ci-action@main
        with:
          graphite_token: ${{ secrets.GRAPHITE_CI_OPTIMIZER_TOKEN }}

  checks:
    needs: optimize_ci
    if: needs.optimize_ci.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.9
        name: Install pnpm
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run-many -t release-policy-check lint test typecheck build skills-validate package-audit --projects=foundry-ai --outputStyle=static
      - name: Verify AI SDK 7 compatibility
        run: |
          compatibility_dir="$RUNNER_TEMP/foundry-ai-sdk-7"
          mkdir -p "$compatibility_dir"
          pnpm --dir packages/foundry-ai pack --pack-destination "$compatibility_dir"
          cp scripts/check-ai-sdk-compatibility.ts "$compatibility_dir"
          cd "$compatibility_dir"
          npm init --yes
          npm pkg set type=module
          npm install ./nyrra-foundry-ai-*.tgz ai@^7.0.0 @ai-sdk/anthropic@^4.0.0 @ai-sdk/google@^4.0.0 @ai-sdk/openai@^4.0.0 @types/json-schema @types/node tsx typescript
          npx tsc --ignoreConfig --noEmit --module nodenext --moduleResolution nodenext --strict --target es2022 --types node check-ai-sdk-compatibility.ts
          npx tsx check-ai-sdk-compatibility.ts v4
          npm install ai@7.0.0-beta.187 @ai-sdk/anthropic@4.0.0-beta.69 @ai-sdk/google@4.0.0-beta.85 @ai-sdk/openai@4.0.0-beta.77
          npx tsc --ignoreConfig --noEmit --module nodenext --moduleResolution nodenext --strict --target es2022 --types node check-ai-sdk-compatibility.ts
          npx tsx check-ai-sdk-compatibility.ts v4
