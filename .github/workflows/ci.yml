name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
    branches-ignore:
      - "**/graphite-base/**"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  optimize_ci:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check_skip.outputs.skip }}
    steps:
      - name: Optimize CI
        id: check_skip
        uses: withgraphite/graphite-ci-action@main
        with:
          graphite_token: ${{ secrets.GRAPHITE_CI_OPTIMIZER_TOKEN }}

  checks:
    needs: optimize_ci
    if: needs.optimize_ci.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - name: Verify AI SDK 6 and 7 compatibility
        run: |
          compatibility_dir="$RUNNER_TEMP/foundry-ai-sdk-7"
          mkdir -p "$compatibility_dir"
          pnpm --dir packages/foundry-ai pack --pack-destination "$compatibility_dir"
          cp .github/fixtures/packed-library.ts "$compatibility_dir"
          cd "$compatibility_dir"
          npm init --yes
          npm pkg set type=module
          # Prevent tsx from resolving workspace source if the scratch directory is inside the repo.
          printf '{}\n' > tsconfig.json
          verify_sdk() {
            ./node_modules/.bin/tsc --ignoreConfig --noEmit --module nodenext --moduleResolution nodenext --strict --target es2022 --types node packed-library.ts
            ./node_modules/.bin/tsx packed-library.ts "$1"
          }
          npm install ./nyrra-foundry-ai-*.tgz ai@^7.0.0 @ai-sdk/anthropic@^4.0.0 @ai-sdk/google@^4.0.0 @ai-sdk/openai@^4.0.0 @ai-sdk/xai@^4.0.58 @types/json-schema @types/node tsx typescript
          verify_sdk v4
          npm install ai@6.0.224 @ai-sdk/anthropic@3.0.96 @ai-sdk/google@3.0.91 @ai-sdk/openai@3.0.84 @ai-sdk/xai@3.0.132
          verify_sdk v3
          npm install ai@7.0.0-beta.187 @ai-sdk/anthropic@4.0.0-beta.69 @ai-sdk/google@4.0.0-beta.85 @ai-sdk/openai@4.0.0-beta.77 @ai-sdk/xai@4.0.0-beta.76
          verify_sdk v4
