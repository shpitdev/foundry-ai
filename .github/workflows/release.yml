name: Publish Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - "nx.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/**"

permissions:
  contents: write
  id-token: write

jobs:
  # Each package releases independently: scripts/release-packages.mjs picks the packages this PR
  # publishes from its changed files and skips private ones. Publish jobs build and tag the merge
  # commit and queue per package and channel, so one package's runs never displace another's.
  # Publishing always authenticates through OIDC. Restricted packages also need a read-only token
  # for version lookups and cannot carry provenance.
  select-packages:
    if: >-
      vars.NPM_PUBLISH_ENABLED == 'true' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Select packages
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "${RUNNER_TEMP}/changed-files"
          node scripts/release-packages.mjs "${HEAD_REF}" < "${RUNNER_TEMP}/changed-files" >> "$GITHUB_OUTPUT"

  publish-prerelease:
    needs: select-packages
    if: >-
      vars.NPM_PUBLISH_ENABLED == 'true' &&
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'release/') &&
      needs.select-packages.outputs.packages != '[]'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ matrix.package.project }}-next
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select-packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.16.0
      - name: Authenticate restricted package reads
        if: matrix.package.access == 'restricted'
        env:
          NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_READ_TOKEN}" ]; then
            echo "::error::Restricted packages need the read-only NPM_READ_TOKEN secret."
            exit 1
          fi
          echo "NODE_AUTH_TOKEN=${NPM_READ_TOKEN}" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Prepare prerelease version
        id: meta
        env:
          PROJECT: ${{ matrix.package.project }}
          PACKAGE_DIR: ${{ matrix.package.dir }}
          PKG_NAME: ${{ matrix.package.name }}
        run: |
          set -euo pipefail
          version=$(node scripts/resolve-next-prerelease-version.mjs "${PROJECT}" rc)
          node scripts/set-package-version.mjs "${PACKAGE_DIR}/package.json" "${version}"
          echo "name=${PKG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build and audit
        env:
          PROJECT: ${{ matrix.package.project }}
        run: pnpm exec nx run-many -t build package-audit tree-shaking --projects="${PROJECT}" --outputStyle=static
      - name: Check if already published
        id: check
        env:
          PKG_NAME: ${{ steps.meta.outputs.name }}
          PKG_VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: next
        run: |
          set -euo pipefail
          if npm view "${PKG_NAME}@${PKG_VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            current_tag_version=$(npm view "${PKG_NAME}" "dist-tags.${DIST_TAG}" --json --registry=https://registry.npmjs.org 2>/dev/null | tr -d '"')
            if [ "${current_tag_version}" = "${PKG_VERSION}" ]; then
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::${PKG_NAME}@${PKG_VERSION} exists but ${DIST_TAG} points to ${current_tag_version:-<unset>}."
            exit 1
          fi
          echo "already_published=false" >> "$GITHUB_OUTPUT"
      - name: Publish prerelease to npm
        if: steps.check.outputs.already_published != 'true'
        env:
          PACKAGE_DIR: ${{ matrix.package.dir }}
          ACCESS: ${{ matrix.package.access }}
          PROVENANCE: ${{ matrix.package.access == 'public' }}
        run: |
          cd "${PACKAGE_DIR}"
          NODE_AUTH_TOKEN="" npm publish --access "${ACCESS}" --tag next --provenance="${PROVENANCE}"

  publish-stable:
    needs: select-packages
    if: >-
      vars.NPM_PUBLISH_ENABLED == 'true' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      needs.select-packages.outputs.packages != '[]'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ matrix.package.project }}-latest
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select-packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.16.0
      - name: Authenticate restricted package reads
        if: matrix.package.access == 'restricted'
        env:
          NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_READ_TOKEN}" ]; then
            echo "::error::Restricted packages need the read-only NPM_READ_TOKEN secret."
            exit 1
          fi
          echo "NODE_AUTH_TOKEN=${NPM_READ_TOKEN}" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Build and audit
        env:
          PROJECT: ${{ matrix.package.project }}
        run: pnpm exec nx run-many -t build package-audit tree-shaking --projects="${PROJECT}" --outputStyle=static
      - name: Resolve package metadata
        id: meta
        env:
          PACKAGE_DIR: ${{ matrix.package.dir }}
          PKG_NAME: ${{ matrix.package.name }}
          EXPECTED_VERSION: ${{ matrix.package.version }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./${PACKAGE_DIR}/package.json').version")
          if [ "${version}" != "${EXPECTED_VERSION}" ] || echo "${version}" | grep -qE '\-'; then
            echo "::error::Expected stable ${EXPECTED_VERSION} from the release branch, found ${version}."
            exit 1
          fi
          echo "name=${PKG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Check if already published
        id: check
        env:
          PKG_NAME: ${{ steps.meta.outputs.name }}
          PKG_VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: latest
        run: |
          set -euo pipefail
          if npm view "${PKG_NAME}@${PKG_VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            current_tag_version=$(npm view "${PKG_NAME}" "dist-tags.${DIST_TAG}" --json --registry=https://registry.npmjs.org 2>/dev/null | tr -d '"')
            if [ "${current_tag_version}" = "${PKG_VERSION}" ]; then
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::${PKG_NAME}@${PKG_VERSION} exists but ${DIST_TAG} points to ${current_tag_version:-<unset>}."
            exit 1
          fi
          echo "already_published=false" >> "$GITHUB_OUTPUT"
      - name: Publish stable to npm
        if: steps.check.outputs.already_published != 'true'
        env:
          PACKAGE_DIR: ${{ matrix.package.dir }}
          ACCESS: ${{ matrix.package.access }}
          PROVENANCE: ${{ matrix.package.access == 'public' }}
        run: |
          cd "${PACKAGE_DIR}"
          NODE_AUTH_TOKEN="" npm publish --access "${ACCESS}" --tag latest --provenance="${PROVENANCE}"
      - name: Tag stable release
        env:
          PKG_NAME: ${{ steps.meta.outputs.name }}
          PKG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="${PKG_NAME}@${PKG_VERSION}"
          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "${tag} already exists on origin; skipping tag push."
            exit 0
          fi
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"
