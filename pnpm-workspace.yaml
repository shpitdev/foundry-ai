packages:
  - 'packages/*'

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  '@swc/core': true
  esbuild: true
  nx: true

overrides:
  '@babel/core@7': 7.29.6
  '@babel/plugin-transform-modules-systemjs@7': 7.29.7
  '@hono/node-server@1': ^1.19.17
  ajv@8: 8.18.0
  handlebars: '>=4.7.9'
  brace-expansion@4: 4.0.1
  brace-expansion@5: 5.0.6
  fast-uri@3: ^3.1.7
  form-data@4: 4.0.6
  js-yaml@4: 4.2.0
  lodash@4: 4.18.0
  picomatch: '>=4.0.4'
  minimatch@<10: '>=10.0.0'
  qs@6: 6.15.2
